<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burnboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --border: #2a3240;
    --fg: #e6edf3; --dim: #8b98a5; --accent: #58a6ff; --green: #3fb950;
    --yellow: #d29922; --red: #f85149; --purple: #bc8cff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header h1 a { color: var(--fg); text-decoration: none; }
  header h1 a:hover { color: var(--accent); text-decoration: none; }
  header .stat { color: var(--dim); font-size: 12px; margin-left: auto; }
  #tabs { display: flex; gap: 4px; }
  #tabs a { color: var(--dim); font-size: 13px; padding: 5px 12px; border-radius: 6px; text-decoration: none; }
  #tabs a:hover { color: var(--fg); background: var(--panel); }
  #tabs a.on { color: var(--fg); background: var(--panel2); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--dim); border: 0; padding: 4px 12px; font: inherit;
    font-size: 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #04121f; }
  #livePause { background: var(--panel); color: var(--dim); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; margin-right: 10px; }
  #livePause.on { background: var(--yellow); color: #04121f; border-color: var(--yellow); }
  .badge.src-codex { color: var(--green); border-color: #1c4a26; }
  .badge.src-claude { color: #e8875a; border-color: #5c3520; }
  #srcSeg { margin-left: auto; }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
  #conn.ok { background: var(--green); }
  main { padding: 18px 20px 60px; max-width: 1240px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
    margin: 26px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  h2:first-child { margin-top: 6px; }
  .badge { font: 11px/1.4 var(--mono); background: var(--panel2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; color: var(--dim); white-space: nowrap; }
  .badge.model { color: var(--mcol, var(--accent)); border-color: color-mix(in srgb, var(--mcol, var(--accent)) 45%, var(--border));
    background: color-mix(in srgb, var(--mcol, var(--accent)) 14%, var(--panel2));
    display: inline-flex; align-items: center; gap: 5px; }
  .mlogo { width: 12px; height: 12px; display: block; flex: none; pointer-events: none; }
  /* the OpenAI file is black-on-white: invert it, then screen away the black ground */
  .mlogo.openai { width: 14px; height: 14px; margin: -1px; filter: invert(1); mix-blend-mode: screen; }
  .badge.src-codex, .badge.src-claude { display: inline-flex; align-items: center; gap: 5px; }
  #srcSeg button { display: inline-flex; align-items: center; gap: 5px; }
  .facetmark { display: inline-flex; vertical-align: -2px; margin-left: 8px; }
  .facetmark + select.facet { margin-left: 4px; }
  .mmark { display: inline-flex; vertical-align: -2px; margin-right: 4px; }
  .hdrlim, .agentlim { display: inline-flex; align-items: center; gap: 5px; }
  .hdrlim b, .agentlim b { color: var(--fg); font-weight: 600; }
  #hdrstat .sep { color: var(--border); }
  .badge.tier { color: var(--purple); }
  .badge.review { color: var(--yellow); }
  .badge.agent { color: var(--purple); border-color: #4a3a6a; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.running { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.idle { background: var(--yellow); }
  .dot.stale { background: var(--dim); }

  /* focus panel — one per active agent */
  .focus { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--mcol, var(--green));
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .focus-wrap { position: relative; }
  .focus-wrap .tree-tick { position: absolute; left: -14px; top: 22px; width: 12px; height: 1px;
    background: var(--border); }
  .focus-wrap .tree-tick::before { content: ''; position: absolute; left: 0; bottom: 0;
    width: 1px; height: 34px; background: var(--border); }
  .focus.nested { background: var(--panel2); }
  .focus.nested .ftitle { font-size: 13.5px; }
  .fhead { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-wrap: wrap; }
  .caret { display: inline-block; color: var(--dim); font-size: 11px; transition: transform .12s; width: 10px; }
  .focus.expanded .caret { transform: rotate(90deg); }
  .fhead-tok { margin-left: auto; font: 11.5px/1 var(--mono); color: var(--dim); white-space: nowrap; }
  .tl-link { font-size: 11.5px; }
  .fhead-tok + .tl-link { margin-left: 12px; }
  .ftitle { font-size: 15px; font-weight: 600; }
  .fmeta { color: var(--dim); font-size: 12px; margin: 4px 0 2px; padding-left: 18px; }
  .promptmini { font-size: 12.5px; color: var(--fg); padding-left: 18px; margin: 2px 0 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .82; }
  .lineage { font-size: 11.5px; color: var(--dim); padding-left: 18px; margin: 2px 0; }
  .lineage .sep { color: var(--border); margin: 0 2px; }
  .lineage b { color: var(--fg); font-weight: 600; }
  .fdetail { display: none; margin-top: 8px; }
  .focus.expanded .fdetail { display: block; }
  .fpath { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; }
  .prompt { margin: 10px 0; padding: 9px 11px; background: var(--panel2); border-radius: 6px;
    border-left: 2px solid var(--mcol, var(--accent)); }
  .prompt .lbl { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
  .prompt p { margin: 3px 0 0; white-space: pre-wrap; max-height: 130px; overflow: auto; }
  .statline { display: flex; gap: 16px; flex-wrap: wrap; font: 12px/1.5 var(--mono); color: var(--dim);
    margin: 8px 0; }
  .statline b { color: var(--fg); font-weight: 600; }
  .chartwrap { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px 4px; margin: 8px 0; }
  .chart { width: 100%; display: block; }
  .chart text { fill: var(--dim); font: 10px var(--mono); }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; margin-top: 12px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .subh { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 0 0 6px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid var(--border); font-size: 12.5px;
    vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
  tr:hover td { background: var(--panel); }
  tr.trow, tr.ctrow { cursor: pointer; }
  tr.trow.on > td, tr.ctrow.on > td { background: rgba(88, 166, 255, .14); }
  tr.trow.on > td:first-child, tr.ctrow.on > td:first-child { box-shadow: inset 3px 0 0 -1px var(--accent); }
  .num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  td.cmd { font-family: var(--mono); font-size: 11px; word-break: break-all; }
  td.base { font-family: var(--mono); color: var(--accent); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .cmdscroll { max-height: 360px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  #live { display: flex; flex-direction: column; gap: 8px; max-width: 620px; }
  .card-wrap { position: relative; margin-bottom: 8px; }
  .card-wrap .tree-tick { position: absolute; left: -13px; top: 20px; width: 11px; height: 1px; background: var(--border); }
  .card-wrap .tree-tick::before { content: ''; position: absolute; left: 0; bottom: 0; width: 1px; height: 26px; background: var(--border); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px;
    cursor: pointer; }
  .card.sub { border-left: 3px solid var(--purple); background: var(--panel2); }
  .card.synthetic { border-style: dashed; opacity: .8; padding: 8px 12px; }
  .card.running { border-left: 3px solid var(--green); }
  .card.idle { border-left: 3px solid var(--yellow); }
  .card.stale { opacity: .6; }
  .card .title { font-weight: 600; }
  .card .meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .bar { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 7px 0 3px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); }
  .tok { display: flex; gap: 10px; font: 11px/1.4 var(--mono); color: var(--dim); flex-wrap: wrap; }
  .empty { color: var(--dim); padding: 16px 0; }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px; font: inherit; }

  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 20; }
  #overlay.on { display: block; }
  #detail { position: absolute; right: 0; top: 0; bottom: 0; width: min(780px, 94vw);
    background: var(--bg); border-left: 1px solid var(--border); overflow-y: auto; padding: 18px 22px; }
  .close { position: absolute; right: 16px; top: 12px; cursor: pointer; color: var(--dim); font-size: 22px; }
  .ev { border-left: 2px solid var(--border); padding: 5px 0 5px 12px; margin: 4px 0; }
  .ev .et { font: 10px/1.4 var(--mono); color: var(--dim); }
  .ev.user { border-color: var(--accent); } .ev.assistant { border-color: var(--green); }
  .ev.tool { border-color: var(--purple); } .ev.reasoning { border-color: var(--yellow); }
  .ev pre { margin: 3px 0 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono);
    font-size: 11.5px; background: var(--panel); padding: 7px 9px; border-radius: 4px;
    max-height: 260px; overflow: auto; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 3px 10px; font-size: 12px; margin: 10px 0; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; }

  /* sortable tables */
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--fg); }
  th.sortable::after { content: ' ↕'; opacity: .3; }
  th.sortable.asc::after { content: ' ↑'; opacity: 1; }
  th.sortable.desc::after { content: ' ↓'; opacity: 1; }

  /* trends */
  .tgrand { display: flex; gap: 20px; flex-wrap: wrap; font: 12px/1.5 var(--mono); color: var(--dim);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .tgrand b { color: var(--fg); }
  .tcols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
  /* agents tab */
  .agname { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .agname .sub { color: var(--dim); font-weight: 400; font: 11px var(--mono); }
  .agrow { cursor: pointer; }
  .agrow:hover td { background: var(--panel); }
  .share { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .share > i { display: block; height: 100%; background: var(--accent); opacity: .75; }
  .mix { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--panel2); }
  .mix > i { display: block; height: 100%; }
  .mixkey { display: flex; gap: 12px; flex-wrap: wrap; font: 10.5px/1.6 var(--mono); color: var(--dim); margin-top: 5px; }
  .mixkey span { display: inline-flex; align-items: center; gap: 4px; }
  .mixkey i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .agdetail td { background: var(--panel2); }
  .warn { color: var(--yellow); }
  .good { color: var(--green); }
  @media (max-width: 1000px) { .tcols { grid-template-columns: 1fr; } }
  .tfilter { width: 100%; margin: 4px 0 8px; }
  .trow-detail td { background: var(--panel2); }
  .trow-detail > td { max-width: 0; }
  .tcols > div { min-width: 0; }
  /* The name column takes whatever the numbers do not, and a long command
     ellipsizes inside it — otherwise one mcp__… name shoves the whole table
     past its half of the grid. Fixed layout also stops the expanded detail
     row from widening the table. */
  #cmdTable > table, #promptTable > table { table-layout: fixed; }
  #cmdTable > table th:nth-child(2), #promptTable > table th:nth-child(2) { width: 116px; }
  #cmdTable > table th:nth-child(3), #promptTable > table th:nth-child(3) { width: 62px; }
  #cmdTable > table th:nth-child(4), #promptTable > table th:nth-child(4) { width: 138px; }
  .trend-cell { width: 130px; }
  .spark { display: block; }
  .spark rect { fill: var(--accent); }

  /* HTML bar chart (no SVG text distortion) */
  .bchart { --ph: 108px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px 4px; margin: 8px 0; }
  /* once you have drilled past a level it is context, not the subject — shrink it
     to a third so the level you are actually looking at gets the room */
  .bchart.drilled { --ph: 34px; opacity: .75; }
  .bchart.drilled:hover { opacity: 1; }
  .bc-title { font: 11px/1.4 var(--mono); color: var(--dim); margin-bottom: 5px; }
  .bc-title .bc-l2 { color: var(--purple); }
  .bc-body { display: flex; gap: 6px; }
  .bc-yax { display: flex; flex-direction: column; justify-content: space-between; width: 42px;
    height: var(--ph); font: 9.5px/1 var(--mono); color: var(--dim); opacity: .7;
    text-align: right; flex: none; }
  .bc-scroll { flex: 1 1 0; min-width: 0; overflow-x: auto; overflow-y: hidden; }
  .bc-inner { --bw: 6px; }   /* overridden per chart from the bucket count */
  .bc-plot { position: relative; display: flex; align-items: flex-end; gap: 1px;
    justify-content: flex-start; height: var(--ph); border-bottom: 1px solid var(--border);
    background: repeating-linear-gradient(to top, transparent 0, transparent calc(50% - 1px), var(--border) calc(50% - 1px), var(--border) 50%); }
  /* narrow fixed-width bars a pixel apart — the chart is as wide as it needs to be,
     not as wide as the panel, so a short series stays compact. Each bar sits in a
     full-height column so a 6px bar still has a comfortable click target. */
  .bc-col { flex: none; width: var(--bw); height: 100%; display: flex; align-items: flex-end; }
  .bc-bar { width: 100%; min-height: 1px; background: var(--accent); opacity: .8;
    border-radius: 1px 1px 0 0; }
  .bc-plot.pick .bc-col { cursor: pointer; }
  .bc-plot.pick .bc-col:hover { background: rgba(88, 166, 255, .13); }
  .bc-plot.pick .bc-col:hover .bc-bar { opacity: 1; }
  /* the selection tints the whole column, so an empty bucket still reads as picked */
  .bc-col.sel { background: rgba(210, 153, 34, .22); }
  .bc-col.sel .bc-bar { background: var(--yellow); opacity: 1; }
  .bc-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bc-line polyline { fill: none; stroke: var(--purple); stroke-width: 1.4; opacity: .5;
    vector-effect: non-scaling-stroke; }
  .bc-xax { display: flex; justify-content: flex-start; gap: 1px; margin-top: 3px;
    font: 9.5px/1 var(--mono); color: var(--dim); }
  .bc-xax span { flex: none; width: var(--bw); white-space: nowrap; text-align: center; overflow: visible; }
  .bc-xax span.lead { text-align: left; }
  .bc-xax span.on { color: var(--yellow); }

  /* the picked bucket, stated above the tables it is filtering */
  .scopebar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--yellow);
    border-radius: 6px; padding: 9px 12px; margin: 10px 0 4px; }
  .scopebar .when { font-size: 18px; font-weight: 650; letter-spacing: .3px; }
  .scopebar .what { font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .scopebar .path { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-left: auto; }
  .scopebar .path b { color: var(--fg); font-weight: 500; }
  /* the entity half of the scope: which row the charts are plotting */
  .scopebar .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 340px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 5px;
    padding: 2px 4px 2px 8px; font: 11px/1.5 var(--mono); color: var(--accent); }
  .scopebar .chip button { border: 0; background: none; color: inherit; padding: 0 3px;
    font-size: 13px; line-height: 1; cursor: pointer; }
  .scopebar .chip button:hover { color: var(--fg); }
  .scopebar button { background: var(--panel); color: var(--dim); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 9px; font: inherit; font-size: 11px; cursor: pointer; }
  .scopebar button:hover { color: var(--fg); border-color: var(--dim); }
  .scopebar .undo { font-size: 13px; line-height: 1; padding: 3px 8px; }
  /* the same escape hatch, sitting at the end of an empty-slice message */
  button.undo.inline { background: var(--panel2); color: var(--accent); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 7px; margin-left: 6px; font: inherit; font-size: 13px;
    line-height: 1.3; cursor: pointer; vertical-align: baseline; }
  button.undo.inline:hover { color: var(--fg); border-color: var(--accent); }
  .ct-ctrls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
  .ct-ctrls .seg button { padding: 3px 9px; font-size: 11px; }
  select.facet { margin-left: 8px; font-size: 12px; padding: 3px 6px; max-width: 160px; }
  .cmdlink { cursor: pointer; border-bottom: 1px dotted currentColor; }
  .cmdlink:hover { color: var(--fg); }

  /* economy */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 4px 0 18px; }
  .ecard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .ecard .big { font-size: 22px; font-weight: 650; font-family: var(--mono); }
  .ecard .cap { font-size: 12px; color: var(--fg); margin-top: 2px; }
  .ecard .hint { font-size: 11px; color: var(--dim); margin-top: 5px; line-height: 1.4; }
  .ecard.warn { border-left: 3px solid var(--yellow); }
  .esec { margin-top: 22px; }
  .esec > .blurb { font-size: 12px; color: var(--dim); margin: 0 0 8px; max-width: 780px; }
  .esec h3 { font-size: 13px; margin: 0 0 3px; }

  #tip { position: fixed; z-index: 40; max-width: 620px; max-height: 60vh; overflow: auto;
    background: #0b0f16; border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px;
    box-shadow: 0 8px 28px rgba(0,0,0,.55); font: 11px/1.5 var(--mono); pointer-events: none; }
  #tip .th { color: var(--dim); text-transform: uppercase; letter-spacing: .5px; font-size: 9.5px; margin-bottom: 5px; }
  #tip .tc { display: flex; gap: 8px; padding: 2px 0; border-top: 1px solid #1a212c; }
  #tip .tc:first-of-type { border-top: 0; }
  #tip .tc .t { color: var(--dim); flex: none; }
  #tip .tc .c { color: var(--green); word-break: break-all; }
  #tip .tc .d { color: var(--purple); flex: none; margin-left: auto; }
  #tip .um { color: var(--accent); white-space: pre-wrap; margin: 2px 0 6px; }
  .promptmini, .card .tok.hoverable { cursor: help; }
</style>
</head>
<body>
<header>
  <h1><a href="https://github.com/kwpoore-lab/burnboard" target="_blank" rel="noopener">burnboard</a></h1>
  <nav id="tabs">
    <a href="#running" data-tab="running" class="on">Activity</a>
    <a href="#history" data-tab="history">History</a>
    <a href="#trends" data-tab="trends">Trends</a>
    <a href="#agents" data-tab="agents">Agents</a>
    <a href="#economy" data-tab="economy">Economy</a>
  </nav>
  <span class="seg" id="srcSeg" title="which agent's sessions to show">
    <button data-src="" class="on">All agents</button><button data-src="codex" id="srcCodex">Codex</button><button data-src="claude" id="srcClaude">Claude Code</button>
  </span>
  <select id="repoSel" class="facet" title="which repository's sessions to show">
    <option value="">all repos</option>
  </select>
  <span id="conn"></span>
  <span class="stat" id="hdrstat">connecting…</span>
</header>
<main>
  <section id="tab-running">
    <div id="usageSummary" class="tgrand" hidden></div>
    <h2>Activity
      <span style="float:right;font-weight:400;text-transform:none;letter-spacing:0">
        <button id="livePause" type="button" title="Pause live updates so you can scroll — nothing is lost, updates just queue">⏸ Pause</button>
        sort
        <span class="seg" id="runSort">
          <button data-s="started" class="on">Started</button><button data-s="tokens">Tokens</button>
        </span>
      </span>

const MODEL_COLORS = {
  // Codex
  'sol': '#f0a13a', 'terra': '#e0687e', 'luna': '#7aa2f7', 'gpt-5.5': '#9aa7b4',
  'codex-auto-review': '#2dd4bf',
  // Claude Code
  'opus': '#bc8cff', 'sonnet': '#6ee7a8', 'haiku': '#e8875a',
};
// unknown/new models still get a stable colour of their own
function hashHue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % 360;
}
function modelStyle(model, source) {
  const m = String(model || '').toLowerCase();
  if (!m) return { color: '#8b98a5', mark: '', label: '' };
  const review = m.includes('auto-review') || m.includes('guardian');
  const claude = source === 'claude' || m.startsWith('claude');
  let color = MODEL_COLORS[m];
  if (!color) color = MODEL_COLORS[m.split('-').pop()];       // gpt-5.6-sol → sol
  if (!color) {                                              // claude-sonnet-5 → sonnet
    const hit = Object.keys(MODEL_COLORS).find(k => m.includes(k));
    if (hit) color = MODEL_COLORS[hit];
  }
  if (!color) color = `hsl(${hashHue(m)} 62% 66%)`;
  return { color, mark: review ? CODEX_MARK : claude ? CLAUDE_MARK : OPENAI_MARK, label: model };
}
// full badge, mark + name, tinted with the model colour
function modelBadge(model, source) {
  const mi = modelStyle(model, source);
  if (!mi.label) return '';
  return `<span class="badge model" style="--mcol:${mi.color}"
    title="model: ${attr(model)}">${mi.mark}${esc(model)}</span>`;
}
// bare mark, for tight spots (meta lines, table cells)
function modelMark(model, source) {
  const mi = modelStyle(model, source);

// mirrors baseCommand in the source parsers: show the command someone cares
// about, not the "export FOO=1;" that precedes it (full text stays in the title)
const SETUP_CLAUSE = /^(?:export\s+(?:\w+=(?:"[^"]*"|'[^']*'|\S+)\s*)+|\w+=(?:"[^"]*"|'[^']*'|\S+)|cd\s+\S+|source\s+\S+|\.\s+\S+)\s*(?:;|&&)\s*/;
function realCmd(s) {
  let out = String(s == null ? '' : s).trim();
  for (let i = 0; i < 8 && SETUP_CLAUSE.test(out); i++) out = out.replace(SETUP_CLAUSE, '').trim();
  return out || String(s == null ? '' : s).trim();
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function attr(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const chartPickers = new Map();
document.addEventListener('click', (e) => {
  const col = e.target.closest('.bc-plot.pick .bc-col');
  if (!col) return;
  const id = col.closest('.bc-plot').dataset.pick;
  const fn = chartPickers.get(id.split(':')[0]);
  if (fn) { e.stopImmediatePropagation(); fn(id, col.dataset.b); }
});

const hhmmss = (ts) => {
  if (!ts) return '';

    : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
};
const dateHM = (ts) => {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return String(ts);
  return d.toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
};
const localDateTime = (ts) => {
  if (!ts) return '–';
  const d = new Date(ts);
  return isNaN(d) ? String(ts) : d.toLocaleString([], { hour12: false });
};

let lastSnap = null;

// ---------------------------------------------------------------------------
// SSE
// ---------------------------------------------------------------------------
// Pausing only holds off re-rendering the live panel so scroll position isn't
// disturbed — the server keeps every command regardless, so unpausing just
// renders the freshest snapshot already received; nothing is missed.
let livePaused = false;
let pendingSnap = null;

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => $('#conn').classList.add('ok');
  es.onerror = () => { $('#conn').classList.remove('ok'); $('#hdrstat').textContent = 'reconnecting…'; };
  es.onmessage = (e) => {
    try {
      const snap = JSON.parse(e.data);
      if (livePaused) { pendingSnap = snap; return; }
      render(snap);
    } catch (_) {}
  };
}

$('#livePause').addEventListener('click', () => {
  livePaused = !livePaused;
  $('#livePause').classList.toggle('on', livePaused);
  $('#livePause').textContent = livePaused ? '▶ Resume' : '⏸ Pause';
  if (!livePaused && pendingSnap) { render(pendingSnap); pendingSnap = null; }
});

function render(snap) {
  lastSnap = snap;
  $('#conn').classList.add('ok');
  const threads = (snap.threads || []).filter(t => (!srcFilter || t.source === srcFilter)
    && (!repoFilter || t.repoKey === repoFilter));
  const running = threads.filter(t => t.status === 'running');
  const heads = agentLimits(snap).map(l => {
    const w = tightestWindow(l.windows);
    return `<span class="hdrlim" title="${attr(l.label)}: ${w.used_percent}% of the ${winLabel(w.window_minutes)} limit used${
      untilReset(w.resets_at) ? `, resets in ${untilReset(w.resets_at)}` : ''}${l.staleFor ? ` (as of ${l.staleFor})` : ''}">${
      l.mark}<b>${pctLeft(w.used_percent)}%</b> left ${winShort(w.window_minutes)}</span>`;
  }).join('<span class="sep"> · </span>');
  $('#hdrstat').innerHTML =
    `${threads.length} live · ${running.length} running · updated ${esc(new Date(snap.now).toLocaleTimeString())}`
    + (heads ? ' · ' + heads : '');

  renderUsage(snap);
  renderLiveTree(threads);
}

// Codex reports its windows in the rollout stream; Claude Code caches its own
// in ~/.claude.json. Both are normalised to {used_percent, window_minutes,
// resets_at} so the header and the usage bar can treat them alike.
function agentLimits(snap) {
  const out = [];
  const rl = snap.rateLimits;
  const codex = [rl && rl.primary, rl && rl.secondary].filter(Boolean);
  if (codex.length) out.push({ id: 'codex', label: 'Codex', mark: OPENAI_MARK, windows: codex, staleFor: '' });
  const cl = snap.claudeLimits;
  if (cl && cl.windows && cl.windows.length) {
    out.push({
      id: 'claude', label: 'Claude Code', mark: CLAUDE_MARK, windows: cl.windows,
      staleFor: cl.fetchedAtMs ? new Date(cl.fetchedAtMs).toLocaleTimeString() : '',
    });
  }
  return out;
}
// the binding window is the one with the least headroom left
const tightestWindow = (ws) => ws.reduce((a, b) => (b.used_percent > a.used_percent ? b : a));
const pctLeft = (used) => (100 - used).toFixed(used > 99 ? 1 : 0);

function winShort(mins) {
  if (mins >= 10080) return 'wk';
  if (mins >= 1440) return Math.round(mins / 1440) + 'd';
  return Math.round(mins / 60) + 'h';
}
function winLabel(mins) {
  if (mins >= 10080) return `${Math.round(mins / 10080)}-week`;
  if (mins >= 1440) return `${Math.round(mins / 1440)}-day`;
  return `${Math.round(mins / 60)}-hour`;
}
// Codex reports a unix timestamp, Claude Code an ISO string
function untilReset(at) {
  const when = typeof at === 'number' ? at * 1000 : Date.parse(at);
  if (!when || isNaN(when)) return '';
  const ms = when - Date.now();
  if (ms <= 0) return 'now';
  const h = ms / 3600000;
  if (h >= 48) return Math.round(h / 24) + 'd';
  if (h >= 1) return Math.floor(h) + 'h ' + Math.round((h % 1) * 60) + 'm';
  return Math.round(ms / 60000) + 'm';
}

function renderUsage(snap) {
  const el = $('#usageSummary');
  const rl = snap.rateLimits, u = snap.usage || {};
  const parts = [];
  for (const l of agentLimits(snap)) {
    const windows = l.windows.map(w =>
      `<b>${pctLeft(w.used_percent)}%</b> left of ${winLabel(w.window_minutes)}${
        untilReset(w.resets_at) ? ` (resets in ${untilReset(w.resets_at)})` : ''}`).join(' · ');
    parts.push(`<span class="agentlim" title="${attr(l.label)} limits${
      l.staleFor ? ` — as of ${l.staleFor}, refreshed when Claude Code runs` : ''}">${l.mark}${windows}</span>`);
  }
  if (u.haveRollups) {
    parts.push(`<span><b>${kfmtN(u.today)}</b> tokens today</span>`);
    parts.push(`<span><b>${kfmtN(u.week)}</b> this week</span>`);
  }
  const liveTok = (snap.threads || []).reduce((a, t) => a + (t.cumReqTokens || 0), 0);
  if (snap.threads && snap.threads.length)
    parts.push(`<span><b>${kfmtN(liveTok)}</b> across ${snap.threads.length} live</span>`);
  if (rl && rl.plan_type) parts.push(`<span style="margin-left:auto">plan: ${esc(rl.plan_type)}${rl.credits && rl.credits.balance && rl.credits.balance !== '0' ? ` · $${esc(rl.credits.balance)} credit` : ''}</span>`);

  el.innerHTML = parts.join('');
  el.hidden = !parts.length;
}

// ---------------------------------------------------------------------------
// Live tree — one hierarchy spanning "prompts running now" + "other live"
// ---------------------------------------------------------------------------
const SRC_LABEL = { codex: 'Codex', claude: 'Claude Code' };
const SRC_MARK = { codex: OPENAI_MARK, claude: CLAUDE_MARK };
const srcBadge = (id) => id ? `<span class="badge src-${esc(id)}">${SRC_MARK[id] || ''}${esc(SRC_LABEL[id] || id)}</span>` : '';
let srcFilter = '';        // '' = all agents | 'codex' | 'claude'
let repoFilter = '';       // '' = all repos, else a repo name from /api/facets
let runSort = 'started';   // 'started' | 'tokens', both descending
let lastRunOrder = [];     // root ids in the order last rendered

function runCmp(a, b) {
  if (runSort === 'tokens') return (b.cumReqTokens || 0) - (a.cumReqTokens || 0);
  return (b.startedAt || '').localeCompare(a.startedAt || '') || (b.mtime - a.mtime);
}

function renderLiveTree(threads) {
  // the same thread id can show up more than once (resumed sessions write a
  // new rollout file but keep the original id) — keep the freshest copy
  const nodes = new Map();
  for (const t of threads) {
    const prev = nodes.get(t.id);
    if (!prev || (t.mtime || 0) >= (prev.mtime || 0)) nodes.set(t.id, t);
  }

  // subagents whose parent isn't in the live window: rebuild the missing
  // ancestors from `lineage` so a guardian is never shown as a top-level root
  for (const t of threads) {
    if (!t.parentId || nodes.has(t.parentId) || !t.lineage || !t.lineage.length) continue;
    let prevId = null;
    for (const l of t.lineage) {
      if (!nodes.has(l.id)) {
        nodes.set(l.id, {
          id: l.id, title: l.title || null, project: l.project || null,
          agentKind: (l.kind && l.kind !== 'main') ? l.kind : null,
          isSubagent: !!(l.kind && l.kind !== 'main'),
          synthetic: true, status: 'stale', taskActive: false,
          mtime: t.mtime, startedAt: t.startedAt, parentId: prevId, lineage: [],
        });
      }
      prevId = l.id;
    }
  }

  const kids = new Map();
  const roots = [];
  for (const t of nodes.values()) {
    const pid = t.parentId && nodes.has(t.parentId) ? t.parentId : null;
    if (pid) (kids.get(pid) || kids.set(pid, []).get(pid)).push(t);
    else roots.push(t);
  }

  const active = (t) => t.status === 'running' || t.taskActive;
  const subtreeActive = (t, seen = new Set()) => {
    if (seen.has(t.id)) return false; seen.add(t.id);
    return active(t) || (kids.get(t.id) || []).some(c => subtreeActive(c, seen));
  };

  // featured roots = those whose subtree has an active agent; fall back to the
  // single most-recent real root so the panel is never empty
  let featured = roots.filter(r => subtreeActive(r));
  if (!featured.length) {
    const real = roots.filter(r => !r.synthetic).sort((a, b) => b.mtime - a.mtime);
    if (real.length) featured = [real[0]];
  }
  const featuredSet = new Set(featured.map(r => r.id));
  const other = roots.filter(r => !featuredSet.has(r.id));

  // sibling order; hold steady while a panel is expanded
  const pos = new Map(lastRunOrder.map((id, i) => [id, i]));
  const frozen = expanded.size && lastRunOrder.length;
  const cmp = (a, b) => {
    if (frozen) {
      const ai = pos.has(a.id) ? pos.get(a.id) : Infinity;
      const bi = pos.has(b.id) ? pos.get(b.id) : Infinity;
      if (ai !== bi) return ai - bi;
    }
    return runCmp(a, b);
  };
  featured.sort(cmp);          // cmp = runCmp, but frozen while a panel is expanded
  other.sort(cmp);
  for (const arr of kids.values()) arr.sort(cmp);

  lastRunOrder = featured.map(r => r.id);

  const seen = new Set();
  const node = (t, d) => {
    if (seen.has(t.id)) return ''; seen.add(t.id);
    let self;
    if (t.synthetic) self = wrap(syntheticRow(t), d);
    else if (d === 0) self = `<div class="focus-wrap" data-root="${t.id}">${focusBlock(t, 0)}</div>`;
    else self = wrap(`<div class="focus-wrap" data-root="${t.id}">${focusBlock(t, d)}</div>`, d);
    const children = (kids.get(t.id) || []).map(c => node(c, d + 1)).join('');
    return self + children;
  };
  const wrap = (inner, d) =>
    `<div class="card-wrap"${d ? ` style="margin-left:${d * 24}px"` : ''}>${d ? '<span class="tree-tick"></span>' : ''}${inner}</div>`;

  $('#running').innerHTML = featured.length
    ? featured.map(r => node(r, 0)).join('')
    : '<div class="empty">No session is currently running.</div>';
  const otherHtml = other.map(r => node(r, 0)).join('');
  $('#live').innerHTML = otherHtml || '<div class="empty">Nothing else active in the last 15 minutes.</div>';
}

function syntheticRow(t) {
  return `<div class="card stale synthetic" onclick="openDetail('${t.id}')">
    <div class="row"><span class="dot stale"></span>
      <span class="title">${esc(t.title || t.id.slice(0, 8))}</span>
      ${t.agentKind ? `<span class="badge agent">${esc(t.agentKind)}</span>` : ''}
      <span class="badge">not in live window</span></div>
    <div class="meta">${esc(t.project || '')} · parent of the agents below — open →</div>
  </div>`;
}

function lineageCrumb(l) {
  return `<a href="#" onclick="openDetail('${l.id}');event.stopPropagation();return false"
    title="${attr(l.title || l.id)}">${esc(l.title ? short(l.title, 46) : l.id.slice(0, 8))}</a>`;
}
function lineageLine(t) {
  if (!t.lineage || !t.lineage.length) return '';
  const kind = t.agentKind || (t.isSubagent ? 'subagent' : '');
  const crumbs = t.lineage.map(lineageCrumb).join(' <span class="sep">›</span> ');
  return `<div class="lineage">${kind ? `<span class="badge agent">${esc(kind)}</span> ` : ''}spawned by ${crumbs} <span class="sep">›</span> <b>this</b></div>`;
}

function focusBlock(t, depth) {
  const nested = depth > 0;
  const name = t.title || (t.agentNickname ? 'agent ' + t.agentNickname
    : t.agentKind ? t.agentKind
    : t.firstUserText ? short(t.firstUserText.replace(/\s+/g, ' '), 60)
    : t.id.slice(0, 8));
  const badges = [];
  badges.push(srcBadge(t.source));
  if (t.primaryModel) badges.push(modelBadge(t.primaryModel, t.source));
  if (t.effort) badges.push(`<span class="badge">effort:${esc(t.effort)}</span>`);
  if (t.serviceTier) badges.push(`<span class="badge tier">${esc(t.serviceTier)}</span>`);
  if (t.autoReview) badges.push(`<span class="badge review">auto-review</span>`);
  if (t.agentNickname) badges.push(`<span class="badge agent">↳ ${esc(t.agentNickname)} d${t.depth}</span>`);
  if (t.originator) badges.push(`<span class="badge">${esc(t.originator)}</span>`);

  // guardians report no model of their own — label them as Codex's reviewer
  const mstyle = modelStyle(t.primaryModel
    || ((t.autoReview || t.agentKind === 'guardian') ? 'codex-auto-review' : ''), t.source);
  const mtag = t.primaryModel ? modelMark(t.primaryModel, t.source) + esc(t.primaryModel)
    : (mstyle.mark ? `<span class="mmark" style="color:${mstyle.color}">${mstyle.mark}</span>codex reviewer` : '');
  const tk = t.tokens || {};
  const ctxPct = t.contextUsed != null ? t.contextUsed : null;
  const proj = t.git ? `${esc(t.git.repo || t.project)} @ ${esc(t.git.branch)}` : esc(t.project || '');
  const open = expanded.has(t.id);

  const prompt = t.firstUserText
    ? `<div class="prompt"><span class="lbl">session prompt</span><p>${esc(t.firstUserText)}</p></div>` : '';
  const latest = (t.lastUserText && t.lastUserText !== t.firstUserText)
    ? `<div class="prompt"><span class="lbl">latest message</span><p>${esc(t.lastUserText)}</p></div>` : '';

  const cmds = (t.commands || []).slice().reverse();      // latest first
  const turns = (t.turns || []).slice().reverse();       // review agents: no commands, only turns
  const stats = t.commandStats || [];
  const promptLine = t.lastUserText || t.firstUserText || '';

  return `
    <div class="focus ${open ? 'expanded' : ''} ${nested ? 'nested' : ''}" data-id="${t.id}"
         style="--mcol:${mstyle.color}">
      <div class="fhead" onclick="toggleExp('${t.id}')">
        <span class="caret">▸</span>
        <span class="dot ${t.status}"></span>
        ${nested && (t.agentKind || t.agentNickname) ? `<span class="badge agent">${esc(t.agentKind || t.agentNickname)}</span>` : ''}
        <span class="ftitle">${esc(name)}</span>
        <span class="badge">${ago(t.ageMs)}</span>
        ${t.taskActive ? '<span class="badge" style="color:var(--green)">● active turn</span>' : ''}
        <span class="fhead-tok">${kfmtN(t.cumReqTokens || tk.total_tokens)} tok${ctxPct != null ? ` · ${ctxPct}% ctx` : ''} · ${t.toolCallCount} cmds · ${t.turnsCompleted}/${t.turnsStarted} turns${t.compactions ? ` · ${t.compactions}⤺` : ''}</span>
        <a href="#" onclick="openDetail('${t.id}');event.stopPropagation();return false" class="tl-link">full timeline →</a>
      </div>
      <div class="fmeta">${proj}${mtag ? ' · ' + mtag : ''}${t.effort ? ' · effort:' + esc(t.effort) : ''}${t.serviceTier ? ' · ' + esc(t.serviceTier) : ''}</div>
      ${nested ? '' : lineageLine(t)}
      <div class="promptmini" data-tip-id="${t.id}">${esc(promptLine)}</div>
      <div class="chartwrap">${consumptionChart(t.tokenSeries, open ? 230 : (nested ? 92 : 140))}</div>

      <div class="fdetail">
        <div class="fpath">${esc(t.cwd || '')}</div>
        <div class="row" style="margin:6px 0">${badges.join(' ')}</div>
        ${prompt}${latest}
        <div class="statline">
          <span><b>${fmt(t.cumReqTokens)}</b> billed tokens (Σ per request)</span>
          ${t.compactions ? `<span title="context compacted — the raw counter reset">${t.compactions}× compacted</span>` : ''}
          <span><b>${fmt(t.contextWindow)}</b> ctx window${ctxPct != null ? ` · ${ctxPct}% full` : ''}</span>
          <span>in <b>${fmt(tk.input_tokens)}</b></span>
          <span>cached <b>${fmt(tk.cached_input_tokens)}</b></span>
          <span>out <b>${fmt(tk.output_tokens)}</b></span>
          <span>reasoning <b>${fmt(tk.reasoning_output_tokens)}</b></span>
        </div>
        <div class="cols">
          <div>
            <p class="subh">Commands — latest first</p>
            <div class="cmdscroll"><table><thead><tr>
              <th>Time</th><th>Command</th>
              <th class="num" title="billed tokens consumed by this command">Tokens</th>
              <th class="num" title="running sum of the Tokens column through this command, reset at the start of each prompt">Command total</th></tr></thead>
              <tbody>${cmds.length ? cmds.map(c => `<tr>
                <td class="num">${hhmmss(c.ts)}</td>
                <td class="cmd" title="${attr(c.cmd)}">${esc(short(realCmd(c.cmd), 140))}</td>
                <td class="num">${c.delta ? fmt(c.delta) : '·'}</td>
                <td class="num">${fmt(c.runSum)}</td></tr>`).join('')
                : `<tr><td colspan="4" class="empty">${turns.length
                    ? 'This agent runs no commands — its turns are below.' : 'No commands yet.'}</td></tr>`}
              </tbody></table></div>
          </div>
          <div>
            ${turns.length ? `<p class="subh">Turns — latest first</p>
            <div class="cmdscroll"><table><thead><tr>
              <th>Time</th><th>What the agent said</th>
              <th class="num" title="billed tokens consumed by this turn">Tokens</th></tr></thead>
              <tbody>${turns.map(t2 => `<tr>
                <td class="num">${hhmmss(t2.ts)}</td>
                <td title="${attr(t2.text)}">${esc(short(t2.text || '—', 120))}</td>
                <td class="num">${t2.delta ? fmt(t2.delta) : '·'}</td></tr>`).join('')}
              </tbody></table></div>` : `
            <p class="subh">Consumption by base command (params ignored)</p>
            <table><thead><tr>
              <th>Base</th><th class="num">Runs</th>
              <th class="num" title="summed Tokens across every run of this base command">Command total</th>
              <th class="num">Last</th></tr></thead>
              <tbody>${stats.length ? stats.map(g => `<tr>
                <td class="base"><span class="cmdlink" data-cmd="${esc(g.base)}">${esc(g.base)}</span></td>
                <td class="num">${g.count}</td>
                <td class="num">${fmt(g.tokens)}</td>
                <td class="num">${hhmmss(g.lastTs)}</td></tr>`).join('')
                : '<tr><td colspan="4" class="empty">–</td></tr>'}
              </tbody></table>`}
          </div>
        </div>
      </div>
    </div>`;
}

const expanded = new Set();
function toggleExp(id) {
  const box = document.querySelector('.focus[data-id="' + id + '"]');
  if (!box) return;
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  if (lastSnap) render(lastSnap);
}
function kfmtN(v) {
  if (v == null || isNaN(v)) return '–';
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'k';
  return Math.round(v);
}

// ---------------------------------------------------------------------------
// consumption chart
//  line/area = our own running sum of per-request tokens (monotonic — the raw
//  Codex counter resets on context compaction, so we don't trust it here)
//  bars      = per-turn tokens
//  dashed markers = context compactions (raw counter reset points)
// ---------------------------------------------------------------------------
function consumptionChart(series, H) {
  H = H || 230;
  if (!series || series.length < 2)
    return `<svg class="chart" viewBox="0 0 800 ${H}" style="height:${H}px"><text x="12" y="24">Not enough data yet…</text></svg>`;
  const W = 800, PL = 58, PR = 12, PT = 12, PB = 22;
  const iw = W - PL - PR, ih = H - PT - PB;
  const times = series.map(p => Date.parse(p.t) || 0);
  const t0 = times[0], t1 = times[times.length - 1] || t0 + 1;
  const span = (t1 - t0) || 1;
  const x = (t) => PL + ((t - t0) / span) * iw;

  // running billed total: prefer server-computed `cum`, else accumulate `last`
  let acc = 0;
  const cum = series.map(p => (p.cum != null ? p.cum : (acc += (p.last || 0))));
  // pad the y-domain so the line doesn't pin the top/bottom edges of the box —
  // without this it always touches both corners (first point = bottom-left,
  // last point = top-right) regardless of the actual shape of the data
  const minC = Math.min(...cum), maxC = Math.max(...cum);
  const rawRange = (maxC - minC) || 1;
  const pad = rawRange * 0.12;
  const base = minC - pad, cMax = rawRange + pad * 2;
  const yC = (v) => PT + ih - ((v - base) / cMax) * ih;
  const lastMax = Math.max(...series.map(p => p.last || 0)) || 1;

  let d = `M ${x(times[0]).toFixed(1)} ${yC(cum[0]).toFixed(1)}`;
  cum.forEach((v, i) => { d += ` L ${x(times[i]).toFixed(1)} ${yC(v).toFixed(1)}`; });
  const area = d + ` L ${x(times[times.length - 1]).toFixed(1)} ${(PT + ih).toFixed(1)} L ${x(times[0]).toFixed(1)} ${(PT + ih).toFixed(1)} Z`;

  const bw = Math.max(1, iw / series.length * 0.6);
  const bars = series.map((p, i) => {
    if (!p.last) return '';
    const bh = (p.last / lastMax) * ih * 0.55;
    return `<rect x="${(x(times[i]) - bw / 2).toFixed(1)}" y="${(PT + ih - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="var(--purple)" opacity="0.2"/>`;
  }).join('');

  const marks = series.map((p, i) => p.reset
    ? `<line x1="${x(times[i]).toFixed(1)}" y1="${PT}" x2="${x(times[i]).toFixed(1)}" y2="${PT + ih}" stroke="var(--yellow)" stroke-width="1" stroke-dasharray="3 2"/>
       <text x="${x(times[i]).toFixed(1)}" y="${PT + 9}" text-anchor="middle" fill="var(--yellow)">compacted</text>` : '').join('');

  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const v = base + cMax * g / 4, yy = yC(v);
    grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W - PR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${PL - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${kfmt(v)}</text>`;
  }
  const tlabel = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px" preserveAspectRatio="none">
    ${grid}${bars}${marks}
    <path d="${area}" fill="var(--accent)" opacity="0.08"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="${PL}" y="${H - 6}">${tlabel(t0)}</text>
    <text x="${W - PR}" y="${H - 6}" text-anchor="end">${tlabel(t1)}</text>
    <text x="${PL + iw / 2}" y="${H - 6}" text-anchor="middle">billed tokens, cumulative (line) · per-turn tokens (bars)</text>
  </svg>`;
}
function kfmt(v) {
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'k';
  return Math.round(v);
}

// ---------------------------------------------------------------------------
// history
// ---------------------------------------------------------------------------
let histAll = [];              // all sessions from /api/history
let histPeriod = 'day';
let histSub = true;
let histModel = '', histEffort = '';
// same drill trail as Trends, but computed locally — no fetch per level
let histTrail = [];            // [{ period, from, to, sel }]
let histPoll = null;

// sessions passing the current subagent / model / effort filters
function histFiltered() {
  return histAll.filter(s =>
    (!srcFilter || s.source === srcFilter)
    && (!repoFilter || s.repoKey === repoFilter)
    && (histSub || !s.isSubagent)
    && (!histModel || s.model === histModel || (histModel === 'codex-auto-review' && s.autoReview))
    && (!histEffort || s.effort === histEffort));
}
let histSort = { col: 'tokens', dir: 'desc' };
const HIST_COLS = [
  { key: 'started', label: 'Started', num: true, get: t => t.startedAt || '' },
  { key: 'thread', label: 'Thread', get: t => (t.title || t.agentNickname || t.id).toLowerCase() },
  { key: 'prompt', label: 'Prompt', get: t => (t.prompt || '').toLowerCase() },
  { key: 'project', label: 'Project', get: t => (t.project || '').toLowerCase() },
  { key: 'model', label: 'Model', get: t => (t.model || '').toLowerCase() },
  { key: 'agent', label: 'Agent', get: t => t.source || '' },
  { key: 'kind', label: 'Kind', get: t => (t.isSubagent ? 'subagent' : 'main') },
  { key: 'tokens', label: 'Tokens', num: true, get: t => t.tokens || 0 },
  { key: 'cmds', label: 'Cmds', num: true, get: t => t.toolCalls || 0 },
];

// mirrors server.js: the "hour" view covers the last hour in 5-minute slots,
// since agent runs are minutes long rather than hours
const HOUR_WINDOW_MS = 1 * 3600 * 1000;
const HOUR_SLOT_MIN = 5;

// History buckets client-side — it already holds every session, so its date
// filter needs no server round trip. Same key shapes as the server's bucketKey
// so bucketRange() and bucketTitle() work on them unchanged.
function histKey(period, when) {
  const d = new Date(when);
  if (isNaN(d)) return '?';
  const p2 = n => String(n).padStart(2, '0');
  if (period === 'month') return `${d.getFullYear()}-${p2(d.getMonth() + 1)}`;
  if (period === 'week') {
    const t = new Date(d); t.setHours(0, 0, 0, 0);
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
    return `${t.getFullYear()}-${p2(t.getMonth() + 1)}-${p2(t.getDate())}`;
  }
  const ymd = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  if (period === 'hourly') return `${ymd}T${p2(d.getHours())}`;
  if (period === 'hour' || period === 'slot') {
    const q = Math.floor(d.getMinutes() / HOUR_SLOT_MIN) * HOUR_SLOT_MIN;
    return `${ymd}T${p2(d.getHours())}:${p2(q)}`;
  }
  return ymd;
}

// every bucket across a drilled range, so empty ones still show as gaps
function histSeed(period, from, to) {
  if (from == null || !isFinite(to)) return [];
  const d = new Date(from);
  if (period === 'month') { d.setDate(1); d.setHours(0, 0, 0, 0); }
  else if (period === 'week' || period === 'day') d.setHours(0, 0, 0, 0);
  else if (period === 'hourly') d.setMinutes(0, 0, 0);
  else { d.setSeconds(0, 0); d.setMinutes(Math.floor(d.getMinutes() / HOUR_SLOT_MIN) * HOUR_SLOT_MIN); }
  const out = [];
  for (let g = 0; d.getTime() < to && g < 4000; g++) {
    out.push(histKey(period, d));
    if (period === 'month') d.setMonth(d.getMonth() + 1);
    else if (period === 'week') d.setDate(d.getDate() + 7);
    else if (period === 'day') d.setDate(d.getDate() + 1);
    else if (period === 'hourly') d.setHours(d.getHours() + 1);
    else d.setMinutes(d.getMinutes() + HOUR_SLOT_MIN);
  }
  return out;
}

// the sessions, buckets and per-bucket totals for one level of the drill
function histLevel(L, rows) {
  let inRange = rows;
  if (L.from != null) inRange = rows.filter(s => {
    const t = Date.parse(s.startedAt);
    return t >= L.from && t < L.to;
  });
  else if (L.period === 'hour') {            // the live view is the last window only
    const cutoff = Date.now() - HOUR_WINDOW_MS;
    inRange = rows.filter(s => Date.parse(s.startedAt) >= cutoff);
  }
  const totals = {};
  for (const s of inRange) {
    const k = histKey(L.period, s.startedAt);
    const T = totals[k] || (totals[k] = { tokens: 0, sessions: 0, subagents: 0, commands: 0 });
    T.tokens += s.tokens || 0;
    T.commands += s.toolCalls || 0;
    if (s.isSubagent) T.subagents++; else T.sessions++;
  }
  const seeded = L.from != null ? histSeed(L.period, L.from, L.to) : [];
  return { rows: inRange, keys: [...new Set([...seeded, ...Object.keys(totals)])].sort(), totals };
}

async function loadHistory() {
  const r = await fetch('/api/history').then(x => x.json());
  if (r.building) {
    const p = r.progress || {};
    $('#hist').innerHTML = `<div class="empty">Building rollup cache… ${p.done || 0} / ${p.total || '?'} sessions</div>`;
    clearTimeout(histPoll); histPoll = setTimeout(loadHistory, 1500);
    return;
  }
  histAll = r.sessions || [];
  fillFacet($('#histModel'), r.facets && r.facets.models, histModel, 'all models', true);
  fillFacet($('#histEffort'), r.facets && r.facets.efforts, histEffort, 'all efforts');
  histResetTrail();
  renderHistory();
}

// Open on the newest bucket, the way the old dropdown did — the table is for
// browsing recent work, not for staring at every session ever recorded.
function histResetTrail() {
  histTrail = [{ period: histPeriod, from: null, to: null, sel: null }];
  const keys = histLevel(histTrail[0], histFiltered()).keys;
  histTrail[0].sel = keys.length ? keys[keys.length - 1] : null;
}

// the deepest bucket actually clicked
function histPicked() {
  for (let i = histTrail.length - 1; i >= 0; i--) if (histTrail[i].sel) return histTrail[i];
  return null;
}

function histPick(level, bucket) {
  const L = histTrail[level];
  if (!L) return;
  histTrail.length = level + 1;
  if (L.sel === bucket) { L.sel = null; renderHistory(); return; }
  L.sel = bucket;
  const finer = FINER[L.period];
  const span = finer && bucketRange(L.period, bucket);
  if (span) histTrail.push({ period: finer, from: span[0], to: span[1], sel: null });
  renderHistory();
}
chartPickers.set('hist', (id, b) => histPick(+id.split(':')[1], b));

function sortHistory(col) {
  if (histSort.col === col) histSort.dir = histSort.dir === 'asc' ? 'desc' : 'asc';
  else histSort = { col, dir: HIST_COLS.find(c => c.key === col).num ? 'desc' : 'asc' };
  renderHistory();
}

function renderHistory() {
  if (!histAll.length) { $('#hist').innerHTML = '<div class="empty">No sessions.</div>'; return; }
  if (!histTrail.length) histResetTrail();
  const base = histFiltered();

  // one chart per drill level; the levels above stay clickable, collapsed
  const levels = histTrail.map(L => histLevel(L, base));
  const charts = histTrail.map((L, i) => {
    const lv = levels[i];
    if (!lv.keys.length) return '';
    const head = (i === 0 ? '' : `${bucketTitle(histTrail[i - 1].period, histTrail[i - 1].sel)} — `)
      + `billed tokens per ${perLbl(L.period)}`;
    return tbarChart(lv.keys, k => (lv.totals[k] && lv.totals[k].tokens) || 0, head,
      { pick: `hist:${i}`, sel: L.sel, period: L.period, drilled: i < histTrail.length - 1 });
  }).join('');

  // the picked bucket is the table's filter
  const pick = histPicked();
  const span = pick && bucketRange(pick.period, pick.sel);
  const rows0 = span ? base.filter(s => {
    const t = Date.parse(s.startedAt);
    return t >= span[0] && t < span[1];
  }) : base;
  const c = HIST_COLS.find(x => x.key === histSort.col);
  const dir = histSort.dir === 'asc' ? 1 : -1;
  const rows = rows0.slice().sort((a, b) => {
    const va = c.get(a), vb = c.get(b);
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
  const sum = rows0.reduce((a, r) => {
    a.tok += r.tokens || 0; a.cmds += r.toolCalls || 0;
    a.main += r.isSubagent ? 0 : 1; a.sub += r.isSubagent ? 1 : 0;
    return a;
  }, { tok: 0, cmds: 0, main: 0, sub: 0 });

  const th = HIST_COLS.map(col =>
    `<th class="sortable ${col.num ? 'num' : ''} ${histSort.col === col.key ? histSort.dir : ''}"
       onclick="sortHistory('${col.key}')">${col.label}</th>`).join('');
  $('#hist').innerHTML = `
    ${charts}
    <div class="scopebar">
      <span class="when">${esc(pick ? bucketTitle(pick.period, pick.sel) : 'All sessions')}</span>
      <span class="what">${fmt(sum.tok)} tokens · ${sum.main} sessions${
        sum.sub ? ` · ${sum.sub} subagents` : ''} · ${fmt(sum.cmds)} commands</span>
      <span class="path">${pick
        ? 'all → ' + histTrail.filter(l => l.sel).map(l => `<b>${esc(bucketTitle(l.period, l.sel))}</b>`).join(' → ')
        : ''}</span>
      ${pick ? undoBtn('hist') : ''}
      ${pick ? '<button data-scope-clear="hist">clear</button>' : ''}
    </div>
    ${rows.length ? '' : `<div class="empty">No sessions in this slice.${
      pick ? ' ' + undoBtn('hist', 'inline') : ''}</div>`}
    <table><thead><tr>${th}</tr></thead><tbody>
    ${rows.map(t => {
      const name = t.title || (t.agentNickname ? 'agent ' + t.agentNickname
        : t.prompt ? short(t.prompt.replace(/\s+/g, ' '), 60) : t.id.slice(0, 8));
      const kd = t.isSubagent ? (t.agentKind || 'subagent') : 'main';
      const kind = kd + (t.agentNickname ? ' · ' + esc(t.agentNickname) : '');
      // guardian rows carry no model of their own — label them as Codex's reviewer
      const guardian = !t.model && (t.autoReview || t.isSubagent && t.agentKind === 'guardian');
      const mdl = t.model || (guardian ? 'codex-auto-review' : '');
      const mlabel = t.model || (guardian ? 'codex reviewer' : '');
      const rest = [t.effort ? 'effort:' + t.effort : null,
        t.autoReview && !guardian ? '+review' : null].filter(Boolean).join(' ');
      const models = mdl
        ? `${modelMark(mdl, t.source)}<span style="color:${modelStyle(mdl, t.source).color}">${esc(mlabel)}</span>${rest ? ' ' + esc(rest) : ''}`
        : (esc(rest) || '–');
      const par = t.parent && (t.parent.title || t.parent.id);
      return `<tr onclick="openDetail('${t.id}')" style="cursor:pointer">
        <td class="num">${dateHM(t.startedAt)}</td>
        <td>${esc(name)}${par ? `<div class="lineage" style="padding:0" onclick="openDetail('${t.parent.id}');event.stopPropagation()">↳ ${esc(short(t.parent.title || t.parent.id, 40))}</div>` : ''}</td>
        <td style="max-width:280px;color:var(--dim)">${esc(short(t.prompt, 100))}</td>
        <td>${esc(t.repo || t.project || '')}${t.branch ? ' @ ' + esc(t.branch) : ''}</td>
        <td>${models}</td>
        <td>${srcBadge(t.source)}</td>
        <td>${kind}</td>
        <td class="num">${fmt(t.tokens)}${t.compactions ? ' ⤺' : ''}</td>
        <td class="num">${t.toolCalls}</td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}

      <dt>started</dt><dd>${esc(localDateTime(s.startedAt))}</dd>

function evRow(e) {
  const t = hhmmss(e.ts);
  if (e.kind === 'message') return `<div class="ev ${e.role}"><div class="et">${t} · ${e.role}</div><pre>${esc(e.text)}</pre></div>`;
  if (e.kind === 'tool') return `<div class="ev tool"><div class="et">${t} · tool ${esc(e.name)}</div><pre>${esc(e.input)}</pre></div>`;
  if (e.kind === 'reasoning') return `<div class="ev reasoning"><div class="et">${t} · reasoning</div><pre>${esc(e.text)}</pre></div>`;
  if (e.kind === 'tokens') return `<div class="ev"><div class="et">${t} · tokens → ${fmt(e.total)}</div></div>`;
  return `<div class="ev"><div class="et">${t} · ${esc(e.kind)}</div></div>`;
}
